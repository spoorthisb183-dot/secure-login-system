<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Secure Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="auth-card">
    <div class="shield" aria-hidden="true">🔐</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your secure account.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="messages">{% for message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" required autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
    <p class="switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </main>
</body>
</html>
